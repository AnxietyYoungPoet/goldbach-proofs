version: 2.1

parameters:
  run-proof-fixtures:
    type: boolean
    default: false
  pilot-pr:
    type: integer
    default: 0
  pilot-head:
    type: string
    default: ""
  pilot-gap:
    type: string
    default: ""

jobs:
  lean-catalogue:
    docker:
      - image: cimg/base:2025.11
    resource_class: large
    steps:
      - checkout
      - run:
          name: Check the catalogue and elaborate all statements
          command: bash .circleci/check-catalogue.sh

  lean-proof-fixtures:
    environment:
      PILOT_PR: << pipeline.parameters.pilot-pr >>
      PILOT_HEAD: << pipeline.parameters.pilot-head >>
      PILOT_GAP: << pipeline.parameters.pilot-gap >>
    machine:
      image: ubuntu-2404:2026.05.1
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Check proof and refutation fixtures
          command: |
            command -v node
            sudo fallocate -l 8G /var/tmp/goldbach-fixture.swap
            sudo chmod 600 /var/tmp/goldbach-fixture.swap
            sudo mkswap /var/tmp/goldbach-fixture.swap
            sudo swapon /var/tmp/goldbach-fixture.swap
            free -h
            bash .circleci/check-proof-fixtures.sh
      - store_artifacts:
          path: /tmp/goldbach-proof-receipt
          destination: proof-receipt

workflows:
  catalogue-pilot:
    jobs:
      - lean-catalogue:
          filters:
            branches:
              only: main
  proof-fixture-pilot:
    when:
      or:
        - << pipeline.parameters.run-proof-fixtures >>
        - not:
            equal:
              - 0
              - << pipeline.parameters.pilot-pr >>
    jobs:
      - lean-proof-fixtures:
          filters:
            branches:
              only: codex/circleci-proof-worker
