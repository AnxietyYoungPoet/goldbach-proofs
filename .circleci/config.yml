version: 2.1

jobs:
  lean-catalogue:
    docker:
      - image: cimg/base:2025.11
    resource_class: large
    steps:
      - checkout
      - run:
          name: Check the catalogue and elaborate all statements
          command: bash .circleci/check-catalogue.sh

  lean-proof-fixtures:
    docker:
      - image: cimg/base:2025.11
    resource_class: large
    steps:
      - checkout
      - run:
          name: Check proof and refutation fixtures
          command: bash .circleci/check-proof-fixtures.sh

workflows:
  catalogue-pilot:
    jobs:
      - lean-catalogue:
          filters:
            branches:
              only: main
  proof-fixture-pilot:
    jobs:
      - lean-proof-fixtures:
          filters:
            branches:
              only: codex/circleci-proof-worker
